---
version: '1.0.0'

environment:
  defaultServices:
    - name: 'lc-test-4'

services:
  - name: "lc-test-4"
    github:
      repository: 'vmelikyan/lc-test-4'
      branchName: 'main'
      docker:
        builder:
          engine: 'buildkit'
        defaultTag: 'main'
        app:
          dockerfilePath: 'sysops/dockerfiles/app.dockerfile'
          env:
            TEST_TEST: 'test'
          ports:
            - 8080
      deployment:
        public: true
        resource:
          cpu:
            request: '10m'
          memory:
            request: '50Mi'
        readiness:
          tcpSocketPort: 8080
        hostnames:
          host: '0env.com'
          defaultInternalHostname: 'lc-test-4-dev-0'
          defaultPublicUrl: 'lc-test-4-dev-0.0env.com'
